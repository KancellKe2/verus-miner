name: Test Verus Miner

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck-and-test:
    name: Shell checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n miner.sh
          bash -n start.sh
          bash -n stop.sh
          bash -n restart.sh
          bash -n status.sh
          bash -n uninstall.sh
          bash -n test.sh

      - name: ShellCheck
        run: |
          shellcheck install.sh miner.sh start.sh stop.sh restart.sh status.sh uninstall.sh test.sh

      - name: Project test suite
        run: ./test.sh
